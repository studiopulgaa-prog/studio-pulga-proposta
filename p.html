<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Studio Pulga</title>
  <style>
    body{margin:0;background:#F4EADD;display:flex;align-items:center;justify-content:center;height:100vh;}
    .dot{width:8px;height:8px;border-radius:50%;background:#6E2C14;animation:pulse 1s infinite;}
    .inv{text-align:center;padding:24px;color:#6E2C14;font-family:'Outfit',Arial,sans-serif;max-width:420px;}
    .inv-t{font-size:28px;font-weight:900;margin-bottom:10px;}
    .inv-s{font-size:15px;line-height:1.5;margin-bottom:22px;}
    .inv-b{display:inline-block;padding:13px 26px;border-radius:50px;background:#6E2C14;color:#F4EADD;text-decoration:none;font-weight:700;font-size:14px;}
    @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
  </style>
</head>
<body>
<div class="dot" id="dot"></div>
<div class="inv" id="inv" style="display:none;"><div class="inv-t" id="inv-t">Link inválido</div><div class="inv-s" id="inv-s">Este link não existe ou foi digitado errado. Peça um novo link ao Studio.</div><a class="inv-b" href="https://wa.me/5513996057099?text=Ol%C3%A1%21+O+link+da+minha+proposta+n%C3%A3o+abriu.+Pode+me+enviar+um+novo%3F">Pedir novo link no WhatsApp →</a></div>
<script>
var SUPA_URL='https://ixclkelqjpfkucejbzuq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4Y2xrZWxxanBma3VjZWpienVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzM5NTAsImV4cCI6MjA5NjA0OTk1MH0.VmXA6P-9IS0TsNnh_2ZGBQZQqtqtCrp4CdHGOVIc5zU';
// so redireciona para paginas de proposta do proprio dominio
var PERMITIDO=/^https:\/\/(proposta\.studiopulga\.com\.br|studio-pulga-proposta[a-z0-9-]*\.vercel\.app)\//;
var slug=window.location.pathname.split('/p/')[1]||'';
function invalido(rede){document.getElementById('dot').style.display='none';if(rede){document.getElementById('inv-t').textContent='Não foi possível abrir agora';document.getElementById('inv-s').textContent='Verifique a conexão e tente novamente.';}document.getElementById('inv').style.display='block';}
if(!slug){invalido();}
else{
  fetch(SUPA_URL+'/rest/v1/rpc/link_url',{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_slug:decodeURIComponent(slug)})
  }).then(function(r){return r.json();}).then(function(url){
    if(typeof url==='string'&&PERMITIDO.test(url)){window.location.replace(url);}
    else{invalido();}
  }).catch(function(){invalido(true);});
}
</script>
</body>
</html>
