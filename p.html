<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Studio Pulga</title>
  <style>
    body{margin:0;background:#F4EADD;display:flex;align-items:center;justify-content:center;height:100vh;}
    .dot{width:8px;height:8px;border-radius:50%;background:#6E2C14;animation:pulse 1s infinite;}
    @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
  </style>
</head>
<body>
<div class="dot"></div>
<script>
var SUPA_URL='https://ixclkelqjpfkucejbzuq.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4Y2xrZWxxanBma3VjZWpienVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzM5NTAsImV4cCI6MjA5NjA0OTk1MH0.VmXA6P-9IS0TsNnh_2ZGBQZQqtqtCrp4CdHGOVIc5zU';
// so redireciona para paginas de proposta do proprio dominio
var PERMITIDO=/^https:\/\/(proposta\.studiopulga\.com\.br|studio-pulga-proposta[a-z0-9-]*\.vercel\.app)\//;
var slug=window.location.pathname.split('/p/')[1]||'';
if(!slug){window.location.replace('/');}
else{
  fetch(SUPA_URL+'/rest/v1/rpc/link_url',{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_slug:decodeURIComponent(slug)})
  }).then(function(r){return r.json();}).then(function(url){
    if(typeof url==='string'&&PERMITIDO.test(url)){window.location.replace(url);}
    else{window.location.replace('/');}
  }).catch(function(){window.location.replace('/');});
}
</script>
</body>
</html>
